<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>One Screen Dungeon — Ranged</title>
  <style>
    body{
      margin:0; height:100vh; display:grid; place-items:center;
      background:#0e0e0e; color:#eee; font-family:system-ui;
    }
    .wrap{ position:relative; }
    canvas{
      background:#141414; border-radius:12px; touch-action:none;
      display:block;
    }
    .hud{
      position:absolute; left:10px; top:10px; display:flex; gap:8px; align-items:center;
      background: rgba(0,0,0,0.35); padding:8px 10px; border-radius:10px;
      backdrop-filter: blur(4px);
    }
    .hud .txt{ font-size:14px; }
    button{
      border:0; border-radius:10px; padding:8px 10px;
      background:#2b2b2b; color:#fff; font-weight:600;
    }
    button:active{ transform: translateY(1px); }
    .hint{ position:absolute; right:10px; top:10px; font-size:12px; opacity:.85; text-align:right; }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="900" height="540"></canvas>

    <div class="hud">
      <div class="txt" id="stats">Score: 0 • Best: 0 • HP: 3</div>
      <button id="restartBtn">Restart</button>
    </div>

    <div class="hint">
      Move: WASD / Arrows<br>
      Aim: Mouse<br>
      Shoot: Left click (hold)<br>
      Restart: R
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Neon Alley: Episode 1</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111111" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="title">Neon Alley</div>
        <div class="subtitle">Episode 1 — A tiny story PWA</div>
      </div>
      <div class="topbar-actions">
        <button class="btn ghost" id="btnMenu" aria-label="Menu">☰</button>
      </div>
    </header>

    <section class="stage" aria-live="polite">
      <div class="scene">
        <div class="scene-title" id="sceneTitle">Loading…</div>

        <div class="portrait-wrap" id="portraitWrap" hidden>
          <img id="portrait" alt="" />
        </div>

        <div class="text" id="text"></div>

        <div class="choices" id="choices"></div>

        <div class="hud">
          <div class="pill" id="hudFlags">Flags: —</div>
          <div class="pill" id="hudInv">Inventory: —</div>
        </div>
      </div>
    </section>

    <footer class="bottombar">
      <button class="btn" id="btnBack">◀ Back</button>
      <button class="btn" id="btnContinue">Continue ▶</button>
    </footer>

    <!-- Menu Modal -->
    <div class="modal" id="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
        <div class="modal-head">
          <div class="modal-title" id="menuTitle">Menu</div>
          <button class="btn ghost" id="btnClose" aria-label="Close">✕</button>
        </div>

        <div class="modal-body">
          <div class="section-title">Save / Load</div>
          <div class="grid">
            <button class="btn" data-save="1">Save Slot 1</button>
            <button class="btn" data-load="1">Load Slot 1</button>
            <button class="btn" data-save="2">Save Slot 2</button>
            <button class="btn" data-load="2">Load Slot 2</button>
            <button class="btn" data-save="3">Save Slot 3</button>
            <button class="btn" data-load="3">Load Slot 3</button>
          </div>

          <div class="section-title">Options</div>
          <label class="row">
            <input type="checkbox" id="optAutosave" checked />
            <span>Autosave (recommended)</span>
          </label>

          <div class="section-title">Danger Zone</div>
          <button class="btn danger" id="btnReset">Reset Game</button>

          <div class="fineprint" id="saveInfo"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>

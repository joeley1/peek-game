<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  />
  <title>Obstacle Dodge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
    }

    .wrap {
      width: min(92vw, 420px);
      display: grid;
      gap: 10px;
      justify-items: center;
    }

    canvas {
      width: 100%;
      height: auto;
      max-height: 72vh; /* KEY: leaves room for buttons */
      background: #0b1220;
      border-radius: 14px;
      touch-action: none;
      display: block;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      background: #2b2b2b;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .hint {
      width: 100%;
      opacity: 0.85;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <canvas id="c" width="420" height="720"></canvas>

    <div class="row">
      <button id="pause">Pause</button>
      <button id="share">Share</button>
      <button id="restart">Restart</button>
    </div>

    <div class="hint">
      Tap to switch lane • R = Restart • P = Pause
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dungeon Archer</title>
  <style>
    body{
      margin:0;
      height:100vh;
      display:grid;
      place-items:center;
      background:#0e0e0e;
      color:#eee;
      font-family:system-ui;
    }
    .wrap{ position:relative; }
    canvas{
      background:#141414;
      border-radius:12px;
      display:block;
    }
    .hud{
      position:absolute;
      top:10px; left:10px;
      background:rgba(0,0,0,.45);
      padding:8px 12px;
      border-radius:10px;
      font-size:14px;
    }
    button{
      margin-top:6px;
      width:100%;
      border:0;
      padding:6px;
      border-radius:8px;
      background:#2b2b2b;
      color:#fff;
      cursor:pointer;
    }
    .hint{
      position:absolute;
      right:10px; top:10px;
      font-size:12px;
      opacity:.85;
      text-align:right;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="900" height="540"></canvas>

    <div class="hud">
      <div id="stats">Score: 0 • HP: 3</div>
      <button id="restart">Restart</button>
    </div>

    <div class="hint">
      Move: WASD / Arrows<br>
      Aim: Mouse<br>
      Shoot: Left Click<br>
      Restart: R
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
